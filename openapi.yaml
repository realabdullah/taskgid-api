openapi: 3.1.0
info:
  title: TaskGid API
  description: |
    API documentation for TaskGid - Task Management Application
    Features include:
    - Task management with assignments and status tracking
    - Workspace and team collaboration
    - Comments and file attachments
    - Activity logging and notifications
    - User authentication and profile management
  version: 1.0.0
  contact:
    name: realabdullah
  license:
    name: ISC
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://tasks-api.abdspace.xyz
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A session token, issued at login and expiring after 7 days.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: |
        A workspace-scoped key (prefixed `tg_key_`), created at
        POST /workspaces/{workspaceSlug}/api-keys. Authenticates as its issuing
        user, with that user's role, but only within the workspace it was
        created in.

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        success:
          type: boolean
          default: false

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            currentPage:
              type: integer
            totalPages:
              type: integer
            totalItems:
              type: integer
            itemsPerPage:
              type: integer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
        profilePicture:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        slug:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [creator, admin, member]
        memberDetail:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - task_created
            - task_updated
            - task_deleted
            - task_assigned
            - task_unassigned
            - comment_created
            - comment_updated
            - comment_deleted
            - attachment_uploaded
            - member_joined
            - member_left
        details:
          type: object
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date-time
          nullable: true
        workspaceId:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/User'
        creator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        taskId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        mentions:
          type: array
          items:
            type: string
          nullable: true
        likeCount:
          type: integer
        replyCount:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        taskId:
          type: string
          format: uuid
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [mention, task_assigned, task_updated, comment_reply, comment_like]
        read:
          type: boolean
        taskId:
          type: string
          format: uuid
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
        actorId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Statistics:
      type: object
      properties:
        tasksByStatus:
          type: object
          properties:
            todo:
              type: integer
            in_progress:
              type: integer
            done:
              type: integer
        tasksByPriority:
          type: object
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
        completionRate:
          type: number
          format: float
        teamMemberCount:
          type: integer

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: object
          properties:
            token:
              type: string
            expires:
              type: string
              format: date-time
        refreshToken:
          type: object
          properties:
            token:
              type: string

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
          description: The current page number.
          example: 1
        totalPages:
          type: integer
          format: int32
          description: The total number of pages available.
          example: 5
        pageSize:
          type: integer
          format: int32
          description: The number of items per page.
          example: 10
        totalCount:
          type: integer
          format: int64
          description: The total number of items matching the query.
          example: 48
        hasNextPage:
          type: boolean
          description: Indicates if there is a next page.
          example: true
        hasPreviousPage:
          type: boolean
          description: Indicates if there is a previous page.
          example: false

    PaginatedTasksResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Tasks fetched successfully"
        data:
          type: object
          properties:
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            pagination:
              $ref: '#/components/schemas/Pagination'

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          description: A description of the error that occurred.
          example: "Resource not found."

    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task_created, task_updated, task_deleted, comment_created, comment_updated, comment_deleted, attachment_uploaded]
        details:
          type: object
          nullable: true
        userId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
        attachmentId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        workspaceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


