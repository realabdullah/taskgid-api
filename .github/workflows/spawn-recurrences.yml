name: Spawn recurring tasks

on:
  schedule:
    # Off the hour: scheduled jobs bunch at :00 and queue behind each other.
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: spawn-recurrences
  cancel-in-progress: false

jobs:
  spawn:
    runs-on: ubuntu-latest
    # DATABASE_URL is an environment secret; a job that does not name the
    # environment is handed an empty value.
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spawn due occurrences
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set — skipping."
            exit 0
          fi
          pnpm recurrences:spawn
